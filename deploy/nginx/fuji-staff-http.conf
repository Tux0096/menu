# of.menu.franchise-fuji.ru — экран официантов, adm.menu.franchise-fuji.ru — админка (маркетинг, управляющие).
# Временный HTTP-конфиг: до выпуска сертификата (deploy/update.sh выпускает его сам через certbot).
server {
    listen 80;
    listen [::]:80;
    server_name of.menu.franchise-fuji.ru adm.menu.franchise-fuji.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    client_max_body_size 30m;
    location = / {
        return 302 /staff/;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
