# of.menu.franchise-fuji.ru — экран официантов, adm.menu.franchise-fuji.ru — админка (маркетинг, управляющие).
# Тот же menu-api; с корня adm. открывается админка (/admin/), of. — терминал официантов (/staff/).
server {
    server_name of.menu.franchise-fuji.ru adm.menu.franchise-fuji.ru;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    client_max_body_size 30m;

    location = / {
        # adm. — админка (Nuxt, /admin/), of. — экран официантов
        if ($host ~* ^adm\.) {
            return 302 /admin/;
        }
        return 302 /staff/;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/of.menu.franchise-fuji.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/of.menu.franchise-fuji.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name of.menu.franchise-fuji.ru adm.menu.franchise-fuji.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
