# Деплой QR-меню на menu.franchise-fuji.ru.
# Автоматически — при push в main; вручную — Actions → Deploy → Run workflow (можно выбрать ветку).
#
# Нужные секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         — IP/домен сервера (например 37.139.43.117)
#   DEPLOY_USER         — пользователь SSH (ubuntu)
#   DEPLOY_SSH_KEY      — приватный SSH-ключ, чей публичный ключ добавлен в ~/.ssh/authorized_keys на сервере
#   OPENROUTER_API_KEY  — ключ AI (OpenRouter)
# Необязательные:
#   IIKO_API_LOGIN, ADMIN_PASSWORD, MANAGER_PASSWORD, WAITER_PASSWORD
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IIKO_API_LOGIN: ${{ secrets.IIKO_API_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BRANCH,OPENROUTER_API_KEY,IIKO_API_LOGIN,ADMIN_PASSWORD,MANAGER_PASSWORD,WAITER_PASSWORD
          command_timeout: 20m
          script: |
            set -e
            cd /home/ubuntu/menu
            git fetch origin "$BRANCH"
            git checkout -- deploy/update.sh 2>/dev/null || true
            # запускаем копию скрипта: сам скрипт обновляет рабочую папку
            git show "origin/$BRANCH:deploy/update.sh" > /tmp/menu-update.sh
            BRANCH="$BRANCH" bash /tmp/menu-update.sh
