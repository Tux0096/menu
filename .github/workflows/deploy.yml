# Деплой QR-меню на menu.franchise-fuji.ru.
# Автоматически — при push в main; вручную — Actions → Deploy → Run workflow (можно выбрать ветку).
#
# Нужные секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         — IP/домен сервера (например 37.139.43.117)
#   DEPLOY_USER         — пользователь SSH (ubuntu)
#   DEPLOY_SSH_KEY      — приватный SSH-ключ, чей публичный ключ добавлен в ~/.ssh/authorized_keys на сервере
#   OPENROUTER_API_KEY  — ключ AI (OpenRouter)
# Необязательные:
#   IIKO_API_LOGIN, IIKO_CLIENT_SECRET (для ключей iiko нового поколения), ADMIN_PASSWORD, MANAGER_PASSWORD, WAITER_PASSWORD
#   IIKO_MENU_API_LOGIN / IIKO_MENU_CLIENT_SECRET — то же, что IIKO_API_LOGIN / IIKO_CLIENT_SECRET (один ключ на всё)
#   IIKO_APP_ID — ID приложения iiko (новые ключи выдают токен только с ним)
#   FCM_SERVICE_ACCOUNT — ключ сервисного аккаунта Firebase (JSON) для push в приложение официанта
#   IIKO_BAR_API_LOGIN / IIKO_BAR_APP_ID / IIKO_BAR_CLIENT_SECRET — второй iiko (бар), если он в другом аккаунте iiko
#   IIKO_EXTERNAL_MENU_ID — ID внешнего меню iiko (если не задан — выбирается из меню ключа)
#   IIKO_<НАЗВАНИЕ>_API_LOGIN — любые дополнительные ключи iiko (например IIKO_LENINGRADSKAYA_BAR_API_LOGIN),
#     по желанию IIKO_<НАЗВАНИЕ>_APP_ID / _CLIENT_SECRET. Попадают на сервер сами, без правки этого файла,
#     и появляются в админке (Меню сети → Настройки iiko → Ключ API iiko) под этим названием.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Админка (menu-admin, Nuxt): собираем здесь, на сервер кладём готовую статику — Node-сборка на сервере не нужна.
      # Сбой сборки не останавливает деплой меню: на сервере останется прежняя админка.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: menu-admin/package-lock.json
      - name: Build admin
        id: admin
        continue-on-error: true
        working-directory: menu-admin
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          tar -czf "$GITHUB_WORKSPACE/menu-admin.tgz" -C .output/public .
      - name: Upload admin
        if: steps.admin.outcome == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: menu-admin.tgz
          target: /home/ubuntu/menu-admin-upload
          overwrite: true

      # Дополнительные ключи iiko: все секреты IIKO_<НАЗВАНИЕ>_API_LOGIN / _APP_ID / _CLIENT_SECRET одной строкой.
      # Значение маскируется в логах; на сервере раскладывается в .env (deploy/update.sh).
      - name: Collect iiko keys
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          B64=$(printf '%s' "$ALL_SECRETS" | jq -c 'with_entries(select(.key | test("^IIKO_[A-Z0-9_]{1,30}_(API_LOGIN|APP_ID|CLIENT_SECRET)$")) | select(.key | test("^IIKO_MENU_") | not))' | base64 -w0)
          echo "::add-mask::$B64"
          echo "IIKO_KEYS_B64=$B64" >> "$GITHUB_ENV"
          printf '%s' "$ALL_SECRETS" | jq -r 'keys[] | select(test("^IIKO_[A-Z0-9_]{1,30}_API_LOGIN$")) | select(test("^IIKO_MENU_") | not) | "  ключ iiko: " + (sub("^IIKO_"; "") | sub("_API_LOGIN$"; ""))'

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IIKO_KEYS_B64: ${{ env.IIKO_KEYS_B64 }}
          BRANCH: ${{ github.ref_name }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IIKO_API_LOGIN: ${{ secrets.IIKO_API_LOGIN }}
          IIKO_CLIENT_SECRET: ${{ secrets.IIKO_CLIENT_SECRET }}
          IIKO_MENU_API_LOGIN: ${{ secrets.IIKO_MENU_API_LOGIN }}
          IIKO_MENU_CLIENT_SECRET: ${{ secrets.IIKO_MENU_CLIENT_SECRET }}
          IIKO_APP_ID: ${{ secrets.IIKO_APP_ID }}
          IIKO_BAR_API_LOGIN: ${{ secrets.IIKO_BAR_API_LOGIN }}
          IIKO_BAR_APP_ID: ${{ secrets.IIKO_BAR_APP_ID }}
          IIKO_BAR_CLIENT_SECRET: ${{ secrets.IIKO_BAR_CLIENT_SECRET }}
          IIKO_BAR_ORGANIZATION_ID: ${{ secrets.IIKO_BAR_ORGANIZATION_ID }}
          IIKO_EXTERNAL_MENU_ID: ${{ secrets.IIKO_EXTERNAL_MENU_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          CLOUDPAYMENTS_PUBLIC_ID: ${{ secrets.CLOUDPAYMENTS_PUBLIC_ID }}
          CLOUDPAYMENTS_API_SECRET: ${{ secrets.CLOUDPAYMENTS_API_SECRET }}
          IIKO_PAYMENT_TYPE_ID: ${{ secrets.IIKO_PAYMENT_TYPE_ID }}
          IIKO_BAR_PAYMENT_TYPE_ID: ${{ secrets.IIKO_BAR_PAYMENT_TYPE_ID }}
          IIKO_PAYMENT_FISCALIZED_EXTERNALLY: ${{ secrets.IIKO_PAYMENT_FISCALIZED_EXTERNALLY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BRANCH,IIKO_KEYS_B64,OPENROUTER_API_KEY,IIKO_API_LOGIN,IIKO_CLIENT_SECRET,IIKO_MENU_API_LOGIN,IIKO_MENU_CLIENT_SECRET,IIKO_APP_ID,IIKO_EXTERNAL_MENU_ID,IIKO_BAR_API_LOGIN,IIKO_BAR_APP_ID,IIKO_BAR_CLIENT_SECRET,IIKO_BAR_ORGANIZATION_ID,FCM_SERVICE_ACCOUNT,CLOUDPAYMENTS_PUBLIC_ID,CLOUDPAYMENTS_API_SECRET,IIKO_PAYMENT_TYPE_ID,IIKO_BAR_PAYMENT_TYPE_ID,IIKO_PAYMENT_FISCALIZED_EXTERNALLY,ADMIN_PASSWORD,MANAGER_PASSWORD,WAITER_PASSWORD
          command_timeout: 20m
          script: |
            set -e
            cd /home/ubuntu/menu
            git fetch origin "$BRANCH"
            git checkout -- deploy/update.sh 2>/dev/null || true
            # запускаем копию скрипта: сам скрипт обновляет рабочую папку
            git show "origin/$BRANCH:deploy/update.sh" > /tmp/menu-update.sh
            BRANCH="$BRANCH" bash /tmp/menu-update.sh
