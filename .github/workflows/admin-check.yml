# Проверка админки (menu-admin) на пулл-реквестах: типы и сборка статики.
name: Admin check

on:
  pull_request:
    paths:
      - 'menu-admin/**'
      - '.github/workflows/admin-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menu-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: menu-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx nuxi typecheck
      - run: npm run generate
