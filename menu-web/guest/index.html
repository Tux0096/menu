<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F9F9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Фуджи — меню</title>
  <!-- Шрифт со своего сервера (без запросов к Google): кириллица — заранее, показ не ждёт (font-display: swap) -->
  <link rel="preload" as="font" type="font/woff2" href="/ui/fonts/wix-madefor-display-cyrillic.woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script>
    // Меню начинает грузиться сразу, параллельно со скриптом приложения: на медленной сети — на секунду раньше
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var slug = q.get('restaurant') || q.get('r') || JSON.parse(localStorage.getItem('fm:restaurant') || 'null');
        if (!slug || !window.fetch) return;
        window.__catalogEarly = {
          slug: slug,
          p: fetch('/api/v1/restaurants/' + encodeURIComponent(slug) + '/catalog')
            .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        };
      } catch (e) { /* без ранней загрузки меню загрузит приложение */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot"><div class="orb orb--md"></div></div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    // Меню открыто внутри Telegram — подключаем Telegram Mini App (весь экран, без браузерной шапки)
    if (/Telegram/i.test(navigator.userAgent) || location.hash.includes('tgWebApp') || window.TelegramWebviewProxy) {
      document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    }
  </script>
  <script src="/app.js"></script>
</body>
</html>
