# Сборка приложения официанта (waiter-app, Flutter) в Codemagic.
# Секреты — только в Codemagic (Teams → Global variables / Code signing), не в репозитории:
#   группа firebase:  GOOGLE_SERVICES_JSON (содержимое google-services.json),
#                     GOOGLE_SERVICE_INFO_PLIST (содержимое GoogleService-Info.plist)
#   Android: ключ подписи загружается в Code signing identities → Android keystores (имя fuji_waiter)
#   iOS: интеграция App Store Connect (API key) с именем codemagic
workflows:
  android:
    name: Официант — Android
    instance_type: linux_x2
    max_build_duration: 40
    working_directory: waiter-app
    environment:
      flutter: stable
      groups:
        - firebase
      android_signing:
        - fuji_waiter
      vars:
        API_BASE: https://menu.franchise-fuji.ru
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    when:
      changeset:
        includes: ['waiter-app/**', 'codemagic.yaml']
    scripts:
      - name: Firebase (push)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON не задан — сборка без push"
          fi
      - name: Зависимости и проверка
        script: |
          flutter pub get
          flutter analyze
      - name: Сборка APK и AAB
        script: |
          BUILD_NUMBER=$((${PROJECT_BUILD_NUMBER:-1} + 1))
          flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=API_BASE=$API_BASE
          flutter build appbundle --release --build-number=$BUILD_NUMBER --dart-define=API_BASE=$API_BASE
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/*.aab

  ios:
    name: Официант — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: waiter-app
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ru.franchisefuji.fujiWaiter
      vars:
        API_BASE: https://menu.franchise-fuji.ru
    triggering:
      events: [tag]
    scripts:
      - name: Firebase (push)
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST не задан — сборка без push"
          fi
      - name: Зависимости
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Профили подписи
        script: xcode-project use-profiles
      - name: Сборка IPA
        script: |
          flutter build ipa --release \
            --build-number=$((${BUILD_NUMBER:-1} + 1)) \
            --dart-define=API_BASE=$API_BASE \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
